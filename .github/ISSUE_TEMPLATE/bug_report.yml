name: Bug Report
description: Report a build failure, SIGILL/crash, ISA dispatch error, or verification failure in CrossCPU
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and what you expected instead.
      placeholder: "e.g., cross-cpu run --isa avx512 exits with SIGILL inside container or fails compilation with GCC 14"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (glibc)
        - Linux (musl / Alpine)
        - Linux (WSL2)
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x86_64)
        - Other POSIX (FreeBSD, OpenBSD, etc.)
    validations:
      required: true

  - type: dropdown
    id: exec_env
    attributes:
      label: Execution Environment
      description: Critical for diagnosing SIGILL, XSAVE/XCR0 masking, and topology detection.
      options:
        - Bare metal
        - Container (Docker / Podman / LXC)
        - VM / Hypervisor (KVM, VMware, Hyper-V, Cloud VM)
        - Emulation / Translation (QEMU, Rosetta 2)
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU Architecture
      options:
        - x86_64
        - arm64 / aarch64
        - riscv64
        - ppc64le / ppc64
        - s390x
        - Other POSIX CPU
    validations:
      required: true

  - type: dropdown
    id: isa
    attributes:
      label: Target ISA (`--isa`)
      options:
        - auto
        - amx
        - avx512
        - avx2
        - sse4
        - sme
        - sve
        - neon
        - rvv
        - vsx
        - vx
        - scalar
        - "N/A (build / install / info failure)"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - PyPI prebuilt wheel (pip / uvx / pipx)
        - Git clone / local source checkout
        - Built from source / sdist (make build or pip install --no-binary)
        - Distro package (Debian / Ubuntu / Fedora / Arch / Nix)
        - Homebrew
    validations:
      required: true

  - type: dropdown
    id: exit_code
    attributes:
      label: Observed Exit Code / Termination
      options:
        - "Build / compilation / install failure"
        - "0 (SUCCESS — unexpected result)"
        - "1 (USAGE_ERROR)"
        - "2 (INIT_ERROR)"
        - "3 (COMPUTE_ERROR)"
        - "4 (HARDWARE_ERROR)"
        - "SIGILL (Illegal Instruction)"
        - "Other crash / signal (SIGSEGV, SIGBUS, etc.)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Version, CPU Model, Kernel & Compiler Details
      description: Paste `cross-cpu --version` (or git commit SHA), CPU model, `uname -a`, Python version, and `cc --version`. If reporting an ISA mismatch or startup crash, also include `lscpu` (Linux) or `sysctl -a | grep -E 'machdep.cpu|hw.optional'` (macOS).
      render: shell
      placeholder: |
        cross-cpu 0.1.2
        CPU: AMD Ryzen 9 7950X / Apple M3 Pro / etc.
        Python 3.12.7
        Linux host 6.11.0 #1 SMP aarch64 GNU/Linux
        gcc (GCC) 14.2.1
    validations:
      required: true

  - type: textarea
    id: info_json
    attributes:
      label: Output of `cross-cpu info --json` (if runnable)
      description: Run `cross-cpu info --json` and paste the complete JSON output. Leave blank if the failure occurs during build, install, or startup.
      render: json
    validations:
      required: false

  - type: textarea
    id: repro_verbose
    attributes:
      label: Failing Command, Verbose (`-v`) Output & Logs
      description: Paste the exact command run with `-v` (probe traces, selected ISA, core affinity) or full compiler error logs. For `SIGILL` crashes, a 1-line debugger trace (`gdb -batch -ex run -ex 'x/i $pc' -ex bt --args ...`) is appreciated if available.
      render: shell
      placeholder: |
        $ cross-cpu run --cores physical --test compute-fp32 --duration 500ms -v
        ...
    validations:
      required: true