# SPDX-License-Identifier: MIT
name: Environment Emulation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # Weekly Sunday 04:00 UTC
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  x86-isa-sigill-matrix:
    name: x86_64 Per-ISA Gating (Hermetic Container + QEMU user-mode)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run x86_64 QEMU per-ISA gating inside clean debian:trixie-slim container
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target isa-x86_64 \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### x86_64 Per-ISA Gating: no summary.md produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-x86-isa
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  arm64-isa-sigill-matrix:
    name: ARM64 Per-ISA Gating (Hermetic Container + QEMU user-mode)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ARM64 QEMU per-ISA gating inside clean debian:trixie-slim container
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target isa-arm64 \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### ARM64 Per-ISA Gating: no summary.md produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-arm64-isa
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  foreign-arch-matrix:
    name: Arch Emulation (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/arm64
            target: arch-arm64
            slug: linux-arm64
            qemu_platform: arm64
          - label: linux/riscv64
            target: arch-riscv64
            slug: linux-riscv64
            qemu_platform: riscv64
          - label: linux/ppc64le
            target: arch-ppc64le
            slug: linux-ppc64le
            qemu_platform: ppc64le
          - label: linux/s390x (big-endian)
            target: arch-s390x
            slug: linux-s390x
            qemu_platform: s390x
          - label: generic (scalar-only)
            target: arch-generic
            slug: generic
            qemu_platform: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU binfmt_misc (${{ matrix.qemu_platform }})
        if: matrix.qemu_platform != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_platform }}

      - name: Run ${{ matrix.target }} inside hermetic container
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target "${TARGET}" \
            --skip-binfmt \
            --duration 100ms \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Arch Emulation (${{ matrix.label }}): no summary.md produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-arch-${{ matrix.slug }}
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  distro-libc-compiler-matrix:
    name: Distro / Libc / Compiler (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-musl-gcc-clang
            target: distro-alpine
          - name: debian-trixie-hardened
            target: distro-debian
          - name: fedora-latest-gcc-clang
            target: distro-fedora
          - name: archlinux-rolling
            target: distro-arch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ${{ matrix.target }} build, unit tests, and offline wheel check
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target "${TARGET}" \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Distro / Libc / Compiler (${{ matrix.name }}): no summary.md produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-distro-${{ matrix.name }}
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  adversarial-container-constraints:
    name: Adversarial Constraints (Offline, Read-Only, Non-Root, Non-Contiguous CPU Set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run adversarial locked-down container test
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target adversarial \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Adversarial Constraints: no summary.md produced" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-adversarial
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore
